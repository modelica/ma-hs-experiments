name: Validate XML manifests

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate XML against XSD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provide xml.xsd to xmllint
        # Current libxml2 cannot fetch the http:// import of xml.xsd in the W3C schema, so map it to a local copy.
        run: |
          curl -fsSL --retry 3 https://www.w3.org/2001/xml.xsd -o "$RUNNER_TEMP/xml.xsd"
          cat > "$RUNNER_TEMP/catalog.xml" <<'EOF'
          <?xml version="1.0"?>
          <catalog xmlns="urn:oasis:names:tc:entity:xmlns:xml:catalog">
            <system systemId="http://www.w3.org/2001/xml.xsd" uri="xml.xsd"/>
          </catalog>
          EOF
          echo "XML_CATALOG_FILES=$RUNNER_TEMP/catalog.xml" >> "$GITHUB_ENV"

      - name: Validate XSD schema
        uses: phpcsstandards/xmllint-validate@d0ee207a94a9539f5d14e78e3b13a81385252c88 # v2.0.1
        with:
          pattern: schema/maHarmonizedSpecificationExperiments.xsd
          xsd-url: https://www.w3.org/2012/04/XMLSchema.xsd

      - name: Validate XML examples
        if: always()
        uses: phpcsstandards/xmllint-validate@d0ee207a94a9539f5d14e78e3b13a81385252c88 # v2.0.1
        with:
          pattern: 'docs/examples/*.xml'
          xsd-file: 'schema/maHarmonizedSpecificationExperiments.xsd'
